<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso 4º ESO: Enlaces Químicos</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; color: #333; padding: 15px; margin: 0; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0277bd; text-align: center; font-size: 1.5em; }
        .subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .section { background: #0288d1; color: #fff; padding: 8px 15px; border-radius: 6px; margin-top: 20px; font-weight: bold; }
        .card { background: #f9fbfd; border-left: 4px solid #0288d1; padding: 15px; margin: 12px 0; border-radius: 6px; }
        .q-text { font-weight: bold; margin-bottom: 8px; }
        label { display: block; margin: 6px 0; cursor: pointer; }
        input[type="text"] { width: 90%; max-width: 280px; padding: 8px; border: 1px solid #bbb; border-radius: 5px; font-size: 1em; }
        .btn { width: 100%; background: #2e7d32; color: #fff; border: none; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .fb { margin-top: 10px; font-size: 0.9em; padding: 8px; border-radius: 5px; display: none; }
        .ok { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .no { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        #score-box { display: none; text-align: center; background: #e1f5fe; border: 2px solid #0288d1; padding: 20px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧪 Repaso Examen: Enlaces Químicos</h1>
    <p class="subtitle">4º ESO Física y Química • Teoría, Tabla pág. 88, Lewis y Polaridad</p>
    <form id="quizForm">
        <div class="section">Parte 1: Preguntas Tipo Test (1 al 14)</div>
        <div id="mc-box"></div>
        <div class="section">Parte 2: Preguntas de Completación (15 al 20)</div>
        <div id="fill-box"></div>
        <button type="button" class="btn" onclick="corregir()">Corregir Examen</button>
    </form>
    <div id="score-box"><h2 id="score-txt"></h2><p id="score-msg"></p></div>
</div>
<script src="preguntas.js"></script>
</body>
</html>
